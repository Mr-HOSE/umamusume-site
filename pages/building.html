<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面正在建设中 - 特雷森学园</title>
    <link rel="icon" type="image/x-icon" href="/source/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f6f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .construction-container {
            text-align: center;
            max-width: 500px;
            padding: 40px 20px;
        }

        /* 预留图片占位区域 */
        .img-placeholder {
            width: 300px;
            height:300px;
            margin: 0 auto 30px;
            border: 3px dashed #3cb371;
            border-radius: 16px;
            background: rgba(60, 179, 113, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .img-placeholder img {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 13px;
        }

        .img-placeholder .placeholder-text {
            display: block;
        }

        .img-placeholder.has-image .placeholder-text {
            display: none;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #2c3e50;
            font-weight: 600;
        }

        p {
            color: #666;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .back-home-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #3cb371;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 12px rgba(60, 179, 113, 0.25);
        }

        .back-home-btn:hover {
            background: #2d9d63;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(60, 179, 113, 0.35);
        }

        .footer-note {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="construction-container">
        <!-- 图片占位：你可以直接替换 src 为真实图片路径 -->
        <div class="img-placeholder" id="imagePlaceholder">
            <img src="/source/building.png" alt="建设中插图">
        </div>

        <h1>此页面正在建设中</h1>
        <p>感谢你的关注！<br>学园正在精心布置这片区域，很快就会与你见面。</p>

        <a href="/index.html" class="back-home-btn">← 返回首页</a>

        <div class="footer-note">
            &copy; 2026 中央特雷森学园
        </div>
    </div>

</body>
</html>
